[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rubylindsa-recsys_jd400"
version = "0.1.0"
description = "按结构键把条目聚类，标出推荐系统算法工程师·提示注入的跨轮传播上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rubylindsa" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rubylindsa.github.io"
Repository = "https://github.com/rubylindsa/recsys_jd400"
Issues = "https://github.com/rubylindsa/recsys_jd400/issues"

[project.scripts]
recsys_jd400 = "recsys_jd400:main"

[tool.setuptools]
py-modules = ["recsys_jd400"]
